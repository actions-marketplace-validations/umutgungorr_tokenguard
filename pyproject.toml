[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tokenguard-cli"
version = "0.2.0"
description = "Fast, zero-dependency Git pre-commit secret and API key scanner CLI with Shannon entropy detection, fingerprinted baselines, and native SARIF v2.1.0."
readme = "README.md"
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
maintainers = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "cli",
    "secrets",
    "secret-scanner",
    "security",
    "devsecops",
    "pre-commit",
    "git-hooks",
    "sarif",
    "entropy",
    "api-keys",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
dependencies = []

[project.scripts]
tokenguard = "tokenguard.main:main"
tokenguard-cli = "tokenguard.main:main"

[project.urls]
Homepage = "https://umutgungorr.com/projects/tokenguard"
Documentation = "https://umutgungorr.com/projects/tokenguard"
Repository = "https://github.com/umutgungorr/tokenguard"
Issues = "https://github.com/umutgungorr/tokenguard/issues"
Changelog = "https://github.com/umutgungorr/tokenguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenguard"]

[tool.pytest.ini_options]
testpaths = ["contract_tests", "tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 100
cache-dir = "../../../.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # Line length handled by formatter
]
